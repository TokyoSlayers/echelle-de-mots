name = "echelle-de-mots-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# L'identifiant ci-dessous est un placeholder pour le développement local.
# Après `npx wrangler d1 create echelle-de-mots`, remplace-le par l'id affiché.
# Ce n'est pas un secret : la base n'accepte des connexions que depuis ce Worker.
[[d1_databases]]
binding = "DB"
database_name = "echelle-de-mots"
database_id = "f10f16bc-2a52-42b8-8b76-b3039d9a9bf6"
migrations_dir = "migrations"

[vars]
ALLOWED_ORIGIN = "http://127.0.0.1:4317"

[env.production]
name = "echelle-de-mots-api"

[env.production.vars]
ALLOWED_ORIGIN = "https://tokyoslayers.github.io"

[[env.production.d1_databases]]
binding = "DB"
database_name = "echelle-de-mots"
database_id = "f10f16bc-2a52-42b8-8b76-b3039d9a9bf6"
migrations_dir = "migrations"
